apiVersion: v1
kind: Service
metadata:
  name: econocausal-api-service
  namespace: econocausal-prod
  labels:
    app.kubernetes.io/name: econocausal-api
    app.kubernetes.io/component: microservice
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8000
      protocol: TCP
  selector:
    app.kubernetes.io/name: econocausal-api
---
apiVersion: v1
kind: Service
metadata:
  name: econocausal-api-lb
  namespace: econocausal-prod
  labels:
    app.kubernetes.io/name: econocausal-api
    app.kubernetes.io/component: microservice-ingress
spec:
  type: LoadBalancer
  ports:
    - name: http
      port: 8000
      targetPort: 8000
      protocol: TCP
  selector:
    app.kubernetes.io/name: econocausal-api
