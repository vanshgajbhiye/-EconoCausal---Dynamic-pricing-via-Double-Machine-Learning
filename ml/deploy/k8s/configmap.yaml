apiVersion: v1
kind: ConfigMap
metadata:
  name: econocausal-config
  namespace: econocausal-prod
  labels:
    app.kubernetes.io/name: econocausal-api
    app.kubernetes.io/component: microservice
data:
  PORT: "8000"
  HOST: "0.0.0.0"
  LOG_LEVEL: "INFO"
  ECONOCAUSAL_MODEL_PATH: "/app/models/econocausal_pipeline.joblib"
  MAX_PRICE_MARKUP_PERCENT: "20.0"
  MAX_PRICE_DISCOUNT_PERCENT: "30.0"
  MIN_GROSS_MARGIN_FLOOR: "0.05"
  CHARM_PRICING_ENABLED: "true"
