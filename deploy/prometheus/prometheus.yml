global:
  scrape_interval: 10s
  evaluation_interval: 10s
  scrape_timeout: 5s

scrape_configs:
  - job_name: "econocausal-pricing-api"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["econocausal-api:8000"]
        labels:
          environment: "production"
          service: "pricing-engine"
          engine: "double-machine-learning"

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
