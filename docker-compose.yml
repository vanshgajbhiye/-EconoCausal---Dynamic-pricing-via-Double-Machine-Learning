version: '3.8'

services:
  # ===========================================================================
  # EconoCausal Dynamic Pricing REST API Microservice
  # ===========================================================================
  econocausal-api:
    build:
      context: .
      dockerfile: Dockerfile
    image: econocausal-pricing-api:1.0.0
    container_name: econocausal-pricing-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ECONOCAUSAL_MODEL_PATH=/app/models/econocausal_pipeline.joblib
      - PORT=8000
      - HOST=0.0.0.0
      - LOG_LEVEL=info
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - econocausal-network
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

  # ===========================================================================
  # Prometheus Telemetry & Time-Series Monitoring Engine
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v2.47.0
    container_name: econocausal-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      econocausal-api:
        condition: service_healthy
    networks:
      - econocausal-network

  # ===========================================================================
  # Grafana Executive & Operations Telemetry Dashboard
  # ===========================================================================
  grafana:
    image: grafana/grafana:10.1.0
    container_name: econocausal-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=econocausal
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - econocausal-network

networks:
  econocausal-network:
    driver: bridge

volumes:
  prometheus_data:
  grafana_data:
